<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasiacode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <header class="d-flex justify-content-between align-items-center p-3 bg-dark text-white">
        <div class="d-flex align-items-center">
            <img src="placeholder.svg" alt="Fantasiacode Logo" width="40" height="40" class="me-2">
            <a href="/" class="text-white text-decoration-none h4">Fantasiacode</a>
        </div>
        <nav>
            <a href="about.html" class="text-white text-decoration-none me-3" data-i18n="about_us">About Us</a>
            <a href="about-program.html" class="text-white text-decoration-none me-3" data-i18n="about_program">About the Program</a>
            <a href="version.html" class="text-white text-decoration-none" data-i18n="program_version">Program Version</a>
        </nav>
        <div class="d-flex align-items-center">
            <select id="language-switcher" class="form-select me-3">
                <option value="en">English</option>
                <option value="ar">العربية</option>
            </select>
        </div>
    </header>
    <div class="container">
        <div class="controls">
            <button id="run-python-btn" data-i18n="run_python">Run Python</button>
            <button id="download-btn" data-i18n="download_zip">Download ZIP</button>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" role="switch" id="theme-toggle">
                <label class="form-check-label" for="theme-toggle" data-i18n="dark_mode">Dark Mode</label>
            </div>
        </div>
        <div class="preview-pane">
            <iframe id="preview"></iframe>
        </div>
        <div class="editor-pane">
            <div class="tabs">
                <button class="tab-button active" data-lang="html" data-i18n="html">HTML</button>
                <button class="tab-button" data-lang="css" data-i18n="css">CSS</button>
                <button class="tab-button" data-lang="javascript" data-i18n="javascript">JavaScript</button>
                <button class="tab-button" data-lang="python" data-i18n="python">Python</button>
            </div>
            <div class="editor-container">
                <div id="html-editor" class="editor"></div>
                <div id="css-editor" class="editor" style="display: none;"></div>
                <div id="javascript-editor" class="editor" style="display: none;"></div>
                <div id="python-editor" class="editor" style="display: none;"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script src="script.js"></script>
    <footer class="bg-dark text-white text-center p-3 mt-auto">
        <div>
            <a href="#" class="text-white text-decoration-none me-3"><i class="bi bi-facebook"></i></a>
            <a href="#" class="text-white text-decoration-none me-3"><i class="bi bi-twitter"></i></a>
            <a href="#" class="text-white text-decoration-none me-3"><i class="bi bi-linkedin"></i></a>
            <a href="#" class="text-white text-decoration-none"><i class="bi bi-github"></i></a>
        </div>
    </footer>
</body>
</html>
